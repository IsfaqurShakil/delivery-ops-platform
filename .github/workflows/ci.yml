name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: delivery_app
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: delivery_ops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delivery_app -d delivery_ops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: delivery_ops
      DB_USER: delivery_app
      DB_PASSWORD: ci_password
      JWT_SECRET: ci-only-fake-jwt-secret-not-a-real-secret-123456
      JWT_EXPIRE_MINUTES: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m alembic upgrade head
      - run: python -m pytest -v
